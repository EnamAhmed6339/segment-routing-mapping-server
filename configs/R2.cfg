!! Segment Routing Mapping Server Lab
!! R2 - ABR between Area 1 and Area 0
!
hostname R2
!
interface Loopback0
 ipv4 address 1.1.1.2 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description To R1 Gi0/0/0/0
 ipv4 address 10.1.12.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description To R3 Gi0/0/0/1
 ipv4 address 10.1.23.2 255.255.255.0
 no shutdown
!
router ospf 1
 segment-routing mpls
 network point-to-point
 segment-routing forwarding mpls
 area 0
  interface GigabitEthernet0/0/0/1
  !
 !
 area 1
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/0
  !
 !
!
segment-routing
 global-block 16000 23999
!
end
