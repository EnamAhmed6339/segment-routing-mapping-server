!! Segment Routing Mapping Server Lab
!! R4 - ABR between Area 0 and Area 2
!
hostname R4
!
interface Loopback0
 ipv4 address 1.1.1.4 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description To R3 Gi0/0/0/0
 ipv4 address 10.1.34.4 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description To R5 Gi0/0/0/1
 ipv4 address 10.1.45.4 255.255.255.0
 no shutdown
!
router ospf 1
 segment-routing mpls
 network point-to-point
 segment-routing forwarding mpls
 area 0
  interface GigabitEthernet0/0/0/0
  !
 !
 area 2
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/1
  !
 !
!
segment-routing
 global-block 16000 23999
!
end
