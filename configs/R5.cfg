!! Segment Routing Mapping Server Lab
!! R5 - Remote edge router | OSPF Area 2
!! No Prefix-SID configured here - all SIDs are learned
!! from the mapping server advertisement originated by R1.
!
hostname R5
!
interface Loopback0
 ipv4 address 1.1.1.5 255.255.255.255
!
interface GigabitEthernet0/0/0/1
 description To R4 Gi0/0/0/1
 ipv4 address 10.1.45.5 255.255.255.0
 no shutdown
!
router ospf 1
 segment-routing mpls
 network point-to-point
 segment-routing forwarding mpls
 area 2
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/1
  !
 !
!
segment-routing
 global-block 16000 23999
!
end
