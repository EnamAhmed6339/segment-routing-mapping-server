!! Segment Routing Mapping Server Lab
!! R1 - Mapping Server | OSPF Area 1
!
hostname R1
!
interface Loopback0
 ipv4 address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description To R2 Gi0/0/0/0
 ipv4 address 10.1.12.1 255.255.255.0
 no shutdown
!
router ospf 1
 segment-routing mpls
 network point-to-point
 segment-routing forwarding mpls
 area 1
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/0
  !
 !
!
segment-routing
 global-block 16000 23999
 !
 mapping-server
  prefix-sid-map
   address-family ipv4
    !! Start prefix, start SID index, range size.
    !! 1.1.1.1/32 -> idx 1 ... 1.1.1.100/32 -> idx 100
    1.1.1.1/32 1 range 100
   !
  !
 !
!
end
