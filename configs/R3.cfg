!! Segment Routing Mapping Server Lab
!! R3 - Backbone internal router | OSPF Area 0
!
hostname R3
!
interface Loopback0
 ipv4 address 1.1.1.3 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description To R4 Gi0/0/0/0
 ipv4 address 10.1.34.3 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description To R2 Gi0/0/0/1
 ipv4 address 10.1.23.3 255.255.255.0
 no shutdown
!
router ospf 1
 segment-routing mpls
 network point-to-point
 segment-routing forwarding mpls
 area 0
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/0
  !
  interface GigabitEthernet0/0/0/1
  !
 !
!
segment-routing
 global-block 16000 23999
!
end
